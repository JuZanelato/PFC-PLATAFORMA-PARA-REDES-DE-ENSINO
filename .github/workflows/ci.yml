name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: SpringPfc/SpringPfc

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SpringPfc/SpringPfc/pom.xml
      - name: Executar testes unitários
        run: mvn -B test -Dtest='!*IT,!*IntegrationTest'

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SpringPfc/SpringPfc/pom.xml
      - name: Executar testes de integração (H2 em memória)
        run: mvn -B test -Dtest='*IT,*IntegrationTest'

  linter:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SpringPfc/SpringPfc/pom.xml
      - name: Executar Checkstyle
        run: mvn -B checkstyle:check
